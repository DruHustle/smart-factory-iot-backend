# NOT INCLUDED in production Kustomize. The current service reads dashboard
# PostgreSQL directly and does not consume a RabbitMQ event stream.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-factory-analytics-service
  labels:
    app.kubernetes.io/name: smart-factory-analytics-service
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: smart-factory-analytics-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: smart-factory-analytics-service
        app.kubernetes.io/component: worker
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: analytics-service
          image: smartfactory.azurecr.io/analyticsservice:release-placeholder
          imagePullPolicy: IfNotPresent
          ports:
            - name: health
              containerPort: 8080
          env:
            - name: DOTNET_ENVIRONMENT
              value: Production
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ASPNETCORE_HTTP_PORTS
              value: "8080"
            - name: PORT
              value: "8080"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
          startupProbe:
            tcpSocket:
              port: health
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: health
            periodSeconds: 20
          readinessProbe:
            tcpSocket:
              port: health
            periodSeconds: 10
      volumes:
        - name: temporary-files
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
