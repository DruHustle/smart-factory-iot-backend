apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-factory-device-service
  labels:
    app.kubernetes.io/name: smart-factory-device-service
    app.kubernetes.io/component: api
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: smart-factory-device-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: smart-factory-device-service
        app.kubernetes.io/component: api
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: smart-factory-device-service
      containers:
        - name: device-service
          image: smartfactory.azurecr.io/deviceservice:release-placeholder
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: DOTNET_ENVIRONMENT
              value: Production
            - name: ASPNETCORE_URLS
              value: http://+:8080
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: smart-factory-backend-runtime
                  key: device-database-connection
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: smart-factory-backend-runtime
                  key: dashboard-jwt-secret
            - name: APPLY_DATABASE_MIGRATIONS
              value: "false"
            - name: AAS_PROVISIONING_TOKEN
              valueFrom:
                secretKeyRef:
                  name: smart-factory-backend-runtime
                  key: aas-provisioning-token
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: smart-factory-backend-runtime
                  key: device-service-redis-url
            - name: AAS_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: smart-factory-backend-runtime
                  key: aas-oidc-client-id
            - name: AAS_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: smart-factory-backend-runtime
                  key: aas-oidc-client-secret
            - name: MqttUsername
              valueFrom:
                secretKeyRef:
                  name: smart-factory-backend-runtime
                  key: mqtt-service-username
            - name: MqttPassword
              valueFrom:
                secretKeyRef:
                  name: smart-factory-backend-runtime
                  key: mqtt-service-password
            - name: AAS_REPOSITORY_URL
              valueFrom:
                configMapKeyRef:
                  name: smart-factory-device-service
                  key: aas-repository-url
            - name: AAS_SUBMODEL_REPOSITORY_URL
              valueFrom:
                configMapKeyRef:
                  name: smart-factory-device-service
                  key: aas-submodel-repository-url
            - name: AAS_CONCEPT_DESCRIPTION_REPOSITORY_URL
              valueFrom:
                configMapKeyRef:
                  name: smart-factory-device-service
                  key: aas-concept-description-repository-url
            - name: AAS_REGISTRY_URL
              valueFrom:
                configMapKeyRef:
                  name: smart-factory-device-service
                  key: aas-registry-url
            - name: AAS_SUBMODEL_REGISTRY_URL
              valueFrom:
                configMapKeyRef:
                  name: smart-factory-device-service
                  key: aas-submodel-registry-url
            - name: AAS_REPOSITORY_REGISTRY_INTEGRATION
              valueFrom:
                configMapKeyRef:
                  name: smart-factory-device-service
                  key: aas-repository-registry-integration
            - name: AAS_ALLOW_UNAUTHENTICATED_LOCAL
              valueFrom:
                configMapKeyRef:
                  name: smart-factory-device-service
                  key: aas-allow-unauthenticated-local
            - name: AASX_FILE_SERVER_URL
              valueFrom:
                configMapKeyRef:
                  name: smart-factory-device-service
                  key: aasx-file-server-url
            - name: AAS_OIDC_TOKEN_URL
              valueFrom:
                configMapKeyRef:
                  name: smart-factory-device-service
                  key: aas-oidc-token-url
            - name: AAS_OIDC_DISCOVERY_URL
              valueFrom:
                configMapKeyRef:
                  name: smart-factory-device-service
                  key: aas-oidc-discovery-url
            - name: AAS_OIDC_SCOPE
              valueFrom:
                configMapKeyRef:
                  name: smart-factory-device-service
                  key: aas-oidc-scope
            - name: MqttBrokerHost
              valueFrom:
                configMapKeyRef:
                  name: smart-factory-device-service
                  key: mqtt-broker-host
            - name: MqttBrokerPort
              value: "8883"
            - name: MqttUseTls
              value: "true"
            - name: EDGE_SITE_ID
              valueFrom:
                configMapKeyRef:
                  name: smart-factory-device-service
                  key: edge-site-id
            - name: EDGE_LINE_ID
              valueFrom:
                configMapKeyRef:
                  name: smart-factory-device-service
                  key: edge-line-id
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
            - name: aiven-ca
              mountPath: /run/secrets/aiven-ca.pem
              subPath: aiven-ca.pem
              readOnly: true
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - curl --fail --silent --show-error http://127.0.0.1:8080/health
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - curl --fail --silent --show-error http://127.0.0.1:8080/health
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - curl --fail --silent --show-error http://127.0.0.1:8080/health/ready
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: aiven-ca
          secret:
            secretName: smart-factory-backend-runtime
            defaultMode: 0440
            items:
              - key: aiven-ca-cert
                path: aiven-ca.pem
        - name: temporary-files
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: smart-factory-device-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: smart-factory-device-service
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: smart-factory-device-service
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: smart-factory-device-service
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: smart-factory-device-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: smart-factory-device-service
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 4
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
