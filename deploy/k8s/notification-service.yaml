# NOT INCLUDED in production Kustomize. The current worker claims the dashboard
# PostgreSQL notification inbox and does not consume a RabbitMQ event stream.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-factory-notification-service
  labels:
    app.kubernetes.io/name: smart-factory-notification-service
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: smart-factory-notification-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: smart-factory-notification-service
        app.kubernetes.io/component: worker
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: notification-service
          image: smartfactory.azurecr.io/notificationservice:release-placeholder
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ASPNETCORE_HTTP_PORTS
              value: "8080"
            - name: AzureAd__Instance
              valueFrom:
                configMapKeyRef:
                  name: smart-factory-device-service
                  key: azure-ad-instance
            - name: AzureAd__TenantId
              valueFrom:
                secretKeyRef:
                  name: smart-factory-backend-runtime
                  key: azure-ad-tenant-id
            - name: AzureAd__ClientId
              valueFrom:
                secretKeyRef:
                  name: smart-factory-backend-runtime
                  key: azure-ad-client-id
            - name: AzureAd__ClientSecret
              valueFrom:
                secretKeyRef:
                  name: smart-factory-backend-runtime
                  key: azure-ad-client-secret
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
      volumes:
        - name: temporary-files
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
