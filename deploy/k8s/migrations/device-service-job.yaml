apiVersion: batch/v1
kind: Job
metadata:
  # Give each schema release a new Job name; Job pod templates are immutable.
  name: smart-factory-device-service-migrate-release-template
  labels:
    app.kubernetes.io/name: smart-factory-device-service
    app.kubernetes.io/component: database-migration
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: smart-factory-device-service-migration
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: smartfactory.azurecr.io/deviceservice:release-placeholder
          imagePullPolicy: IfNotPresent
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: DOTNET_ENVIRONMENT
              value: Production
            - name: APPLY_DATABASE_MIGRATIONS
              value: "true"
            - name: MIGRATION_ONLY
              value: "true"
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: smart-factory-backend-runtime
                  key: device-database-connection
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: smart-factory-backend-runtime
                  key: dashboard-jwt-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
            - name: aiven-ca
              mountPath: /run/secrets/aiven-ca.pem
              subPath: aiven-ca.pem
              readOnly: true
      volumes:
        - name: temporary-files
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: aiven-ca
          secret:
            secretName: smart-factory-backend-runtime
            defaultMode: 0440
            items:
              - key: aiven-ca-cert
                path: aiven-ca.pem
